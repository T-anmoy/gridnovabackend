    audience: [customer, associate]
    questions:
      en: ["How can I pay?", "Do you accept UPI?", "Can I pay cash?", "Do you take cheques?"]
      hi: ["भुगतान कैसे करें?", "क्या UPI से पैसे दे सकते हैं?"]
      bn: ["কীভাবে টাকা দেব?", "UPI তে পেমেন্ট করা যাবে?"]
    facts:
      - "Grid Nova accepts payment only by cheque, NEFT, RTGS or IMPS."
      - "Grid Nova does not accept cash, UPI or demand drafts, at any stage."
      - "Pay only into Grid Nova's own current account: GRID NOVA ENERGY, HDFC Bank, Ruby More Branch, Kolkata; IFSC HDFC0005385. The full account number is on the proposal, invoice and receipts."
      - "Cheques are made payable to \"GRID NOVA ENERGY\"."
      - "Before the first transfer, check that the bank shows the payee name as GRID NOVA ENERGY."
      - "Payment is made in milestones set out in the proposal."
    do_not_say: ["the full account number", "any other account or payee"]
    source: "Customer Payment Policy 5.1–5.2, www.gridnova.in, 23 Oct 2026; config/execution_payments.yaml enabled_modes"
    status: published

  - id: payment-safety
    topic: pricing
    audience: [customer, associate]
    questions:
      en: ["Can I pay the associate?", "Someone asked me to pay a different account", "Where do I pay?"]
    facts:
      - "No associate or employee may accept payment in their own name or account."
      - "Grid Nova never changes its bank details by phone, WhatsApp or email."
      - "If anyone asks for payment to a different account or in cash, do not pay; call {config:proposal_content.company.phone}."
      - "Customers can check an associate by scanning the QR code on the associate's Grid Nova ID card."
    source: "Customer Payment Policy 5.2–5.3 (23 Oct 2026); messages/en.json careers.faq"
