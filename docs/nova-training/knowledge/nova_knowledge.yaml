      - "Refunds, where due under the agreement, are paid only to the account the payment came from."
      - "Cancellation terms are set out in the customer's proposal and agreement; a team member can explain them."
    do_not_say: ["refund amounts, percentages or days"]
    source: "Customer Payment Policy 5.6–5.7 (23 Oct 2026)"
    status: published

  - id: finance-loans
