# Nova knowledge base — draft v1 (26 Oct 2026)
#
# WHAT THIS IS: every fact Nova (the website assistant) and Nova Records may state, as
# atomic, sourced entries. It is RUNTIME KNOWLEDGE, not fine-tuning data: the backend
# loads it, retrieves the entries relevant to a message and adds them to the prompt and
# to the guardrails' allow-list (see BE-16 prompt). Facts change (subsidies, prices,
# rules); runtime knowledge can be corrected in one place, a fine-tuned model cannot.
#
# RULES FOR EDITING
# - One fact per line in `facts`. No adjectives that are not in the source.
# - status:
#     verified        Grid Nova confirmed it, or it is a government rule already in
#                     config/subsidies.yaml / config/price_list.yaml
#     published       already on www.gridnova.in (Grid Nova approved the site copy)
#     external        government source, cited; Nova states it as the rule, never a ruling
#     unconfirmed     developer default — Nova must NOT state it until Grid Nova confirms
#     conflict        sources disagree — resolve before loading (see conflicts.md)
#     needs_grid_nova the answer does not exist yet; Nova routes to the team
# - Only `verified`, `published` and `external` entries are loaded at runtime.
# - Numbers that are config values (subsidy amounts, makes, warranty years) must be
#   rendered FROM config at load time (BE-16), not copied here, so they never drift.
#   They are written here as {config:path} placeholders.
# - audience: customer (website Nova), associate (portal Nova), staff (Nova Records).
# - Never put a price, a per-kW rate, a savings percentage or a payback period in an
#   answer for customers (guardrails and evals block them).

schema_version: 1
as_of: 2026-10-26

entries:

