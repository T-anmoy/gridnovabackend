# ── 3. Process, engineering and standards ───────────────────────────────────────
  - id: process-stages
    topic: process
    audience: [customer, associate]
    questions:
      en: ["What is the process?", "What happens after I enquire?", "How do you install solar?"]
    facts:
      - "Every project follows six stages: feasibility analysis, system design, procurement, construction, commissioning, operation and maintenance."
      - "Feasibility checks sunlight, shading, the roof's structural condition, the grid connection point and financial inputs."
      - "Design covers module layout, strings, inverter, cable sizing, AC switchgear, single-line diagram and protection."
      - "Commissioning includes insulation resistance tests, string checks, inverter tests, protection checks and DISCOM synchronisation; the system is handed over with a test report and operating manual."
    source: messages/en.json technology.steps
    status: published

  - id: customer-journey
    topic: process
    audience: [customer, associate]
    questions:
      en: ["What are the steps to get solar at home?", "How does buying from you work?"]
    facts:
      - "1. Enquiry or Solar Calculator estimate. 2. A team member follows up. 3. Site survey. 4. Formal proposal with the system, bill of quantity and payment terms. 5. Acceptance. 6. Payments in milestones. 7. Installation and commissioning. 8. Net-metering and subsidy paperwork with the DISCOM and national portal. 9. Handover with warranty, then O&M."
    source: system workflow (backend app/proposals, app/payments, app/execution, app/handover)
    status: unconfirmed   # Grid Nova to confirm the customer-facing order and wording — data request R3

  - id: standards
    topic: process
    audience: [customer]
    questions:
      en: ["Are your panels certified?", "Do you follow government standards?"]
    facts:
      - "Modules come from certified manufacturers with BIS/IEC certifications."
      - "Designs comply with MNRE guidelines, Central Electricity Authority regulations and state DISCOM interconnection standards."
      - "Equipment is procured against agreed specifications; no substitutions without the client's sign-off."
    do_not_say: ["that a specific make is DCR compliant", "model numbers"]
    source: messages/en.json technology.standards
    status: published

  - id: site-survey
    topic: process
    audience: [customer]
    questions:
      en: ["Do you visit the site?", "What happens in the site survey?", "How much roof space do I need?"]
    facts:
      - "A site survey confirms shadow-free roof area, roof type and structure, the electrical connection and the final system size before a formal proposal."
      - "A significantly shaded roof needs a site visit before size is confirmed."
      - "Roof space needed is roughly 100 sq ft of shadow-free area per kW, confirmed at the survey."
    source: app/survey; app/pricing/instant_estimate.py SIGNIFICANT_SHADING_NOTE; config/solar_estimate.yaml
    status: unconfirmed   # roof area per kW is PRO-17/EST registry; survey charge unknown — R5

