# ── 3. Process, timelines, documents ────────────────────────────────────────────
  - id: process-stages
    topic: process
    audience: [customer, associate]
    questions:
      en: ["How do you install solar?", "What is your engineering process?"]
    facts:
      - "Every project follows six stages: feasibility, system design, procurement, construction, commissioning, operation and maintenance."
      - "Feasibility checks sunlight, shading, the roof's structural condition and the grid connection point."
      - "Design covers module layout, strings, inverter, cable sizing, AC switchgear, single-line diagram and protection."
      - "Commissioning includes insulation tests, string checks, inverter tests, protection checks and DISCOM synchronisation; the system is handed over with a test report and operating manual."
    source: messages/en.json technology.steps
    status: published

  - id: customer-journey
    topic: process
    audience: [customer, associate]
    questions:
      en: ["What are the steps to get solar at home?", "What happens after I enquire?", "How does buying from you work?"]
      hi: ["घर पर सोलर लगवाने की प्रक्रिया क्या है?"]
      bn: ["বাড়িতে সোলার লাগানোর ধাপগুলো কী?"]
    facts:
      - "1. Enquiry — website form, Solar Calculator, phone, or a Grid Nova associate."
      - "2. A team member calls back within 48 business hours."
      - "3. Free site survey: roof, shading, structure and electrical connection."
      - "4. Formal proposal: system, equipment, bill of quantity, price with GST, payment terms, warranty."
      - "5. The customer accepts the proposal and pays the first milestone."
      - "6. Grid Nova files the DISCOM / PM Surya Ghar portal application with the customer's documents."
      - "7. Materials are delivered and the system is installed."
      - "8. DISCOM inspection, net meter installation and commissioning."
      - "9. Handover with test report, warranty and the first year's free O&M."
      - "10. For PM Surya Ghar customers, the subsidy is claimed on the portal and paid by the government into the customer's bank account."
    source: "Highline (delegated by Grid Nova, 27 Oct 2026); system workflow app/proposals, app/payments, app/handover"
    status: verified

  - id: timelines
    topic: process
    audience: [customer, associate]
    questions:
      en: ["How long does installation take?", "When will my system be ready?", "How long does the whole process take?"]
      hi: ["सोलर लगने में कितना समय लगता है?"]
      bn: ["সোলার লাগাতে কত সময় লাগে?"]
    facts:
      - "The site survey is usually arranged within a few working days of the enquiry."
      - "The formal proposal usually follows within a few working days of the survey."
      - "Installing a home rooftop system on site usually takes 1 to 3 days once materials are delivered; larger commercial systems take longer."
      - "Most waiting time is for DISCOM steps (approval, inspection, net meter), which vary by DISCOM and season."
      - "The team gives a project-specific timeline after the survey."
    do_not_say: ["a guaranteed completion date", "a fixed number of days for subsidy credit"]
    source: "Highline research (delegated by Grid Nova, 27 Oct 2026); WBERC Rooftop Solar Regulations 2025"
    status: verified

  - id: site-survey
    topic: process
    audience: [customer]
    questions:
      en: ["Is the site survey free?", "What happens in the site survey?", "How much roof space do I need?"]
      hi: ["क्या साइट सर्वे फ्री है?"]
      bn: ["সাইট সার্ভে কি বিনামূল্যে?"]
    facts:
      - "The site survey is free."
      - "It confirms shadow-free roof area, roof type and structure, the electrical connection and the final system size before a formal proposal."
      - "Keep a recent electricity bill ready and give access to the roof and the meter."
      - "A rooftop system needs roughly 80 to 100 sq ft of shadow-free roof per kW; the survey confirms the exact figure."
      - "A heavily shaded roof needs the survey before any size is confirmed."
    source: "Grid Nova via Tanmoy, 26 Oct 2026 (free survey); config/solar_estimate.yaml; proposal 83–100 sq ft/kWp (C5 settled as a range)"
    status: verified

  - id: documents
    topic: process
    audience: [customer, associate]
    questions:
      en: ["What documents do I need?", "Documents for PM Surya Ghar?", "What papers are needed for net metering?"]
      hi: ["पीएम सूर्य घर के लिए कौन से दस्तावेज़ चाहिए?"]
      bn: ["কোন কোন কাগজপত্র লাগবে?"]
    facts:
      - "A recent electricity bill in the applicant's name (it shows the consumer number)."
      - "Aadhaar card of the applicant."
      - "Bank account details for the subsidy: a cancelled cheque or the passbook front page; the account should be in the applicant's name."
      - "Proof of ownership or right to use the roof (for example a property tax receipt or deed)."
      - "A mobile number and email linked to the application."
      - "Photographs of the roof are taken by the team at the survey."
      - "The team confirms the exact list for the customer's DISCOM before applying."
    do_not_say: ["that a document can be skipped", "asking the customer to send documents in chat"]
    source: "PM Surya Ghar national portal process (pmsuryaghar.gov.in); Highline research (delegated, 27 Oct 2026)"
    status: external

