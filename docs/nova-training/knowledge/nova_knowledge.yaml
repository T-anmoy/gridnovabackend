# ── 5. Subsidy (rules, never a ruling) ──────────────────────────────────────────
  - id: subsidy-central
    topic: subsidy
    audience: [customer, associate, staff]
    questions:
      en: ["How much subsidy will I get?", "What is PM Surya Ghar?", "Is there a subsidy for 5 kW?"]
      hi: ["पीएम सूर्य घर सब्सिडी कितनी है?"]
      bn: ["পিএম সূর্য ঘর ভর্তুকি কত?"]
    facts:
      - "PM Surya Ghar: Muft Bijli Yojana gives Central Financial Assistance for grid-connected rooftop solar on an individual house with made-in-India (DCR) panels."
      - "{config:subsidies.central.residential.general} — first 2 kW, the 3rd kW, maximum for 3 kW or more (most states)."
      - "{config:subsidies.central.residential.special} in special-category states: {config:subsidies.central.special_category_states}."
      - "Part-kW sizes get a proportional amount; nothing extra above 3 kW."
      - "Eligibility is decided under the scheme, not by Grid Nova or the chat; the Solar Calculator shows a customer's own figure."
    do_not_say: ["'you will get', 'you are eligible', 'guaranteed subsidy'"]
    source: config/subsidies.yaml (MNRE guidelines 7 Jun 2024; PIB Aug 2024)
    status: external

  - id: subsidy-society
    topic: subsidy
    audience: [customer, associate]
    questions:
      en: ["Does a housing society get subsidy?", "Subsidy for apartment common area?"]
    facts:
      - "A housing society or RWA gets central assistance per kW for common facilities, including EV charging: {config:subsidies.central.housing_society}."
      - "Eligible capacity is the lowest of the installed capacity, 3 kW per house, and 500 kW."
    source: config/subsidies.yaml
    status: external

  - id: subsidy-exclusions
    topic: subsidy
    audience: [customer, associate]
    questions:
      en: ["Is there subsidy for my shop?", "Can a factory get PM Surya Ghar?", "Off-grid subsidy?"]
    facts:
      - "No residential PM Surya Ghar subsidy for commercial, industrial or government connections, non-DCR panels, or off-grid systems."
      - "Grid-connected systems with a battery or hybrid inverter can still qualify, on the panel capacity only."
    source: config/subsidies.yaml; MNRE operational guidelines
    status: external

  - id: subsidy-process
    topic: subsidy
    audience: [customer, associate]
    questions:
      en: ["How do I receive the subsidy?", "Who pays the subsidy?", "How long does subsidy take?"]
    facts:
      - "The customer applies on the national PM Surya Ghar portal; Grid Nova handles the documentation."
      - "After installation the DISCOM inspects the system and approves it on the portal."
      - "The subsidy is paid by the government directly into the customer's bank account (or loan account, if the system is financed)."
      - "MNRE guidelines target release within 15 days of DISCOM approval; actual time depends on the portal and DISCOM."
    source: MNRE PM Surya Ghar operational guidelines (7 Jun 2024)
    status: external

  - id: subsidy-state
    topic: subsidy
    audience: [customer, associate]
    questions:
      en: ["Is there extra state subsidy in Bihar?", "Does West Bengal give additional subsidy?"]
    facts:
      - "Extra state support has been announced in {config:subsidies.state_top_ups[status!=confirmed].state} but is not confirmed by an official order."
      - "It is not guaranteed; the Solar Calculator shows it separately, marked 'Announced'."
    do_not_say: ["any state top-up amount", "that the customer will receive it"]
    source: config/subsidies.yaml; app/llm/company_facts.py
    status: external

  - id: dcr-meaning
    topic: subsidy
    audience: [customer]
    questions:
      en: ["What is DCR?", "Do I need DCR panels?"]
    facts:
      - "DCR (domestic content requirement) means panels made in India from India-made solar cells."
      - "PM Surya Ghar subsidy requires DCR panels; a customer who does not take the subsidy is not bound by DCR."
    do_not_say: ["that any specific make or model is DCR compliant (not confirmed by Grid Nova)"]
    source: MNRE operational guidelines; config/price_list.yaml dcr_status null
    status: external

# ── 6. Net metering and generation ──────────────────────────────────────────────
  - id: net-metering
    topic: technical
    audience: [customer]
    questions:
      en: ["What is net metering?", "Will you apply for net metering?"]
    facts:
      - "Net metering lets the electricity company record power the system exports to the grid against power taken from it."
      - "Grid Nova handles the net-metering application with the DISCOM for residential customers."
      - "Rules and settlement for surplus units differ by state electricity regulator."
    do_not_say: ["export rates or credit values (EST registry open)"]
    source: messages/en.json industries.residential; services.green
    status: published

  - id: generation
    topic: technical
    audience: [customer, associate]
    questions:
      en: ["How many units will 3 kW produce?", "How much electricity does 1 kW generate?"]
    facts:
      - "Grid Nova's design basis is about 120 units per kW per month on average."
      - "Actual generation depends on sunlight, weather, shading, orientation, tilt and panel cleanliness."
    source: config/solar_estimate.yaml (Grid Nova, 15 Oct 2026); config/proposal_document.yaml generation_note
    status: verified

  - id: phase-load
    topic: technical
    audience: [customer]
    questions:
      en: ["Do I need three-phase?", "My sanctioned load is 2 kW, can I put 3 kW?"]
    facts:
      - "Systems can be single-phase or three-phase; the phase on the electricity bill decides which."
      - "A system larger than the sanctioned load may need a load increase from the DISCOM; Grid Nova handles this."
    source: config/price_list.yaml phase_ranges; BE-14 above_sanctioned_load warning
    status: unconfirmed   # confirm wording and DISCOM rules per state — R9

