      - "A team member can explain what the bank will need from Grid Nova (proposal and invoice)."
    do_not_say: ["interest rates", "that a loan will be approved", "names of partner banks"]
    source: "PM Surya Ghar national portal (pmsuryaghar.gov.in) — bank loan option; Grid Nova payment policy"
    status: external

# ── 5. Subsidy (rules, never a ruling) ──────────────────────────────────────────
  - id: subsidy-central
    topic: subsidy
    audience: [customer, associate, staff]
    questions:
      en: ["How much subsidy will I get?", "What is PM Surya Ghar?", "Is there a subsidy for 5 kW?"]
      hi: ["पीएम सूर्य घर सब्सिडी कितनी है?"]
      bn: ["পিএম সূর্য ঘর ভর্তুকি কত?"]
    facts:
      - "PM Surya Ghar: Muft Bijli Yojana gives Central Financial Assistance for grid-connected rooftop solar on an individual house with made-in-India (DCR) panels."
      - "{config:subsidies.central.residential.general} — first 2 kW, the 3rd kW, maximum for 3 kW or more."
      - "Part-kW sizes get a proportional amount; nothing extra above 3 kW."
      - "Eligibility is decided under the scheme, not by Grid Nova or the chat; the Solar Calculator shows a customer's own figure."
    do_not_say: ["'you will get', 'you are eligible', 'guaranteed subsidy'"]
    source: config/subsidies.yaml (MNRE guidelines 7 Jun 2024)
