    audience: [customer, associate]
    questions:
      en: ["Is there subsidy for my shop?", "Can a factory get PM Surya Ghar?", "Off-grid subsidy?"]
    facts:
      - "No residential PM Surya Ghar subsidy for commercial, industrial or government connections, non-DCR panels, or off-grid systems."
    source: config/subsidies.yaml; MNRE operational guidelines
    status: external

  - id: subsidy-process
    topic: subsidy
    audience: [customer, associate]
    questions:
      en: ["How do I receive the subsidy?", "Who pays the subsidy?", "How long does subsidy take?"]
    facts:
      - "The application is made on the national PM Surya Ghar portal; Grid Nova handles the documentation with the customer."
      - "After installation the DISCOM inspects the system, installs the net meter and records commissioning on the portal."
      - "The subsidy is then paid by the government directly into the customer's bank account (or loan account, if financed)."
      - "The time depends on the portal and the DISCOM; Grid Nova follows it up."
    do_not_say: ["a fixed number of days", "that Grid Nova pays or deducts the subsidy"]
    source: MNRE PM Surya Ghar operational guidelines (7 Jun 2024); pmsuryaghar.gov.in
    status: external

  - id: subsidy-state
    topic: subsidy
    audience: [customer, associate]
    questions:
      en: ["Is there extra state subsidy in Bihar?", "Does West Bengal give additional subsidy?"]
    facts:
      - "Extra state support has been announced in {config:subsidies.state_top_ups[status!=confirmed].state} but is not confirmed by an official order."
      - "It is not guaranteed; the Solar Calculator shows it separately, marked 'Announced'."
    do_not_say: ["any state top-up amount", "that the customer will receive it"]
    source: config/subsidies.yaml
    status: external

  - id: dcr-meaning
    topic: subsidy
    audience: [customer]
    questions:
      en: ["What is DCR?", "Do I need DCR panels?"]
    facts:
      - "DCR (domestic content requirement) means panels made in India from India-made solar cells."
      - "PM Surya Ghar subsidy requires DCR panels; a customer who does not take the subsidy is not bound by DCR."
      - "The proposal states which panels are offered for a subsidy project."
    do_not_say: ["that any specific make or model is DCR compliant"]
    source: MNRE operational guidelines
    status: external

# ── 6. Net metering, load and generation ────────────────────────────────────────
  - id: net-metering
    topic: technical
    audience: [customer]
    questions:
      en: ["What is net metering?", "Can I sell extra electricity?", "Will you apply for net metering?"]
      hi: ["नेट मीटरिंग क्या है?"]
      bn: ["নেট মিটারিং কী?"]
    facts:
      - "Net metering records the power the system sends to the grid against the power taken from it, so exported units reduce the bill."
      - "Grid Nova handles the net-metering application with the DISCOM."
      - "DISCOMs: in West Bengal WBSEDCL, CESC (Kolkata area) and others; in Bihar NBPDCL (north) and SBPDCL (south)."
      - "West Bengal (WBERC Rooftop Solar Regulations 2025): consumers choose net metering, net billing or gross metering; under net metering, unused surplus units at the end of the settlement year lapse."
      - "Bihar (BERC net and gross metering regulations): domestic PM Surya Ghar consumers on net metering do not pay the DISCOM's application fee or meter testing charges (BERC, 2026)."
      - "A system is sized mainly to cover the customer's own use, not to sell power."
    do_not_say: ["export rates, feed-in tariffs or credit values", "that the bill will become zero"]
    source: "WBERC Grid Interactive Rooftop Solar PV Regulations 2025 (energetica-india.net, 12 Aug 2025); BERC waiver (energetica-india.net, 15 Jul 2026)"
    status: external

  - id: phase-load
    topic: technical
    audience: [customer]
    questions:
      en: ["Do I need three-phase?", "My sanctioned load is 2 kW, can I put 3 kW?"]
      hi: ["मेरा लोड 2 kW है, क्या 3 kW लगा सकते हैं?"]
      bn: ["আমার লোড 2 kW, 3 kW লাগানো যাবে?"]
    facts:
      - "Systems can be single-phase or three-phase; the supply on the electricity bill decides which."
      - "The DISCOM normally allows a rooftop system up to the sanctioned load; in West Bengal the cap is the sanctioned load or 500 kW, whichever is lower."
      - "A system larger than the sanctioned load needs a load increase from the DISCOM first; Grid Nova's team helps with the application."
      - "In West Bengal, systems up to 10 kW need no separate DISCOM feasibility study."
    do_not_say: ["load-increase charges"]
    source: "WBERC Rooftop Solar Regulations 2025; Highline (delegated by Grid Nova, 27 Oct 2026)"
    status: external

  - id: generation
    topic: technical
    audience: [customer, associate]
    questions:
      en: ["How many units will 3 kW produce?", "How much electricity does 1 kW generate?"]
    facts:
      - "Grid Nova's design basis is about 120 units per kW per month on average."
      - "Actual generation depends on sunlight, season, weather, shading, orientation, tilt and panel cleanliness."
    source: config/solar_estimate.yaml (Grid Nova, 15 Oct 2026)
    status: verified

# ── 7. Customer FAQs (delegated by Grid Nova to Highline, 27 Oct 2026) ──────────
  - id: faq-power-cut
    topic: faq
    audience: [customer]
    questions:
      en: ["Will solar work during a power cut?", "Does on-grid solar give backup?"]
      hi: ["क्या बिजली कटने पर सोलर चलेगा?"]
      bn: ["লোডশেডিংয়ে সোলার চলবে?"]
    facts:
      - "A grid-connected system without a battery switches off automatically during a power cut; this is a safety rule so no power flows to the line while it is being repaired."
      - "It restarts by itself when grid power returns."
      - "Grid Nova does not offer battery backup yet."
    source: "Highline (delegated, 27 Oct 2026); anti-islanding requirement in CEA connectivity standards"
    status: verified

  - id: faq-monsoon-night
    topic: faq
    audience: [customer]
    questions:
      en: ["Does solar work on cloudy days?", "What about monsoon?", "Does it work at night?"]
    facts:
      - "Panels produce less on cloudy and rainy days and nothing at night; the grid supplies power then."
      - "The 120 units per kW per month figure is an average over the year, including monsoon months."
    source: "Highline (delegated, 27 Oct 2026); config/solar_estimate.yaml"
    status: verified

  - id: faq-bill-zero
    topic: faq
    audience: [customer]
    questions:
      en: ["Will my electricity bill become zero?", "How much will I save?"]
    facts:
      - "Savings depend on the system size, the customer's own usage and the DISCOM's tariff and metering rules."
      - "Fixed charges on the electricity bill usually continue."
      - "The Solar Calculator gives an estimate; the proposal shows the expected generation."
    do_not_say: ["savings percentages", "payback periods", "'zero bill'"]
    source: "Highline (delegated, 27 Oct 2026)"
    status: verified

  - id: faq-roof
    topic: faq
    audience: [customer]
    questions:
      en: ["Is my roof strong enough?", "Will panels damage my roof?", "Can you install on a tin roof?"]
    facts:
      - "The free site survey checks the roof's type and structure before sizing."
      - "Panels are fixed on a mounting structure designed for the roof type; RCC and metal-sheet roofs are both common."
      - "Shaded parts of the roof are avoided in the layout."
    do_not_say: ["wind-speed ratings or structure specifications not in the proposal"]
    source: "Highline (delegated, 27 Oct 2026); messages/en.json technology"
    status: verified

  - id: faq-move-house
    topic: faq
    audience: [customer]
    questions:
      en: ["What if I move house?", "Can the system be shifted?"]
    facts:
      - "A rooftop system can usually be dismantled and reinstalled at a new site; the team assesses it, and DISCOM paperwork is needed again."
    do_not_say: ["shifting charges", "that the subsidy transfers"]
    source: "Highline (delegated, 27 Oct 2026)"
    status: verified

  - id: faq-cleaning
    topic: faq
    audience: [customer]
    questions:
      en: ["How do I clean the panels?", "Do panels need maintenance?"]
      hi: ["पैनल कैसे साफ़ करें?"]
      bn: ["প্যানেল কীভাবে পরিষ্কার করব?"]
    facts:
      - "Clean panels with plain water and a soft cloth or sponge, early morning or evening when they are cool."
      - "Do not use detergent, hard brushes or high-pressure jets, and do not stand on the panels."
      - "In dusty months clean every one to two weeks; rain helps but does not remove all dust."
      - "Keep the area around the inverter dry and ventilated; never open the inverter or wiring."
      - "If the inverter shows an error or generation drops sharply, contact Grid Nova."
    source: "Highline (delegated, 27 Oct 2026); common manufacturer guidance"
    status: verified

  - id: faq-panel-life
    topic: faq
    audience: [customer]
    questions:
      en: ["How long do solar panels last?"]
    facts:
      - "Panels are expected to last about {config:price_list.commercial_terms.solar_panel_life_span}; output reduces slowly with age."
      - "This is a life span, not a warranty period."
    do_not_say: ["degradation percentages", "component warranty years"]
    source: "config/price_list.yaml (Grid Nova, 14 Oct 2026)"
    status: verified

