      - "A proposal is valid for {config:sales_policy.proposal_validity_days} days from its date."
      - "Proposals are signed by Raju Paul, Authorised Signatory."
      - "Every proposal carries a QR code; scanning it on www.gridnova.in confirms it is a genuine Grid Nova proposal."
