# Nova knowledge base — v2 (29 Oct 2026)
#
# WHAT THIS IS: every fact Nova (the website assistant) and Nova Records may state, as
# atomic, sourced entries. It is RUNTIME KNOWLEDGE, not fine-tuning data: the backend
# loads it (BE-16), retrieves the entries relevant to a message, adds them to the prompt
# and to the guardrails' allow-list. A fact that changes is corrected here, once.
#
# v2 CHANGES (from v1, 26 Oct 2026)
# - All six conflicts settled with Grid Nova (see conflicts.md): one service name,
#   West Bengal and Bihar only, no payback claims, roof area as a range, track-record wording.
# - Grid Nova answers added: partnership firm est. 2026, two offices, free site survey,
#   languages, payment methods (cheque/NEFT/RTGS/IMPS only), signatory, validity.
# - Content Grid Nova delegated to Highline (27 Oct 2026) added: customer journey,
#   typical timelines, document checklist, net metering per state, load rules, customer
#   FAQs, cleaning advice. Source marked "Highline (delegated by Grid Nova, 27 Oct 2026)".
# - Published website policy facts added (Customer Payment Policy, 23 Oct 2026).
#
# RULES FOR EDITING
# - One fact per line in `facts`. No adjectives that are not in the source.
# - status:
#     verified        Grid Nova confirmed it, delegated it to Highline, or it is in config
#     published       already on www.gridnova.in (Grid Nova approved the site copy)
#     external        government / regulator source, cited; stated as the rule, never a ruling
#     conflict        sources disagree — not loaded (see conflicts.md)
#     needs_grid_nova no answer yet; Nova routes to the team and logs a knowledge gap
# - Only verified, published and external entries are loaded at runtime.
# - {config:path} values are rendered from config at load time (BE-16), never copied.
# - audience: customer (website Nova), associate (portal Nova), staff (Nova Records).
# - Never a price, per-kW rate, discount, EMI, savings percentage or payback period in a
#   customer answer; never a subsidy ruling ("you will get"); never a DCR claim for a make.
# - Questions in hi/bn are for retrieval; facts stay in English and Nova replies in the
#   customer's language.

schema_version: 2
as_of: 2026-10-29

entries:

