  - id: calculator-how
    topic: pricing
    audience: [customer, associate]
    questions:
      en: ["How does your calculator work?", "Is the calculator accurate?"]
    facts:
      - "It asks the state, electricity company, and monthly units (most accurate) or bill amount or roof area; optionally phase, sanctioned load and shading."
      - "It recommends a size, and sometimes a smaller option, with how much of the usage each covers."
      - "It shows the central subsidy and the expected generation, with how confident the estimate is."
      - "State subsidies that are only announced are shown separately and not deducted."
      - "It is an estimate; final figures come after the site survey."
