    source: messages/en.json careers.faq[1]
    status: published

  - id: associate-payout
    topic: associates
    audience: [associate]
    questions:
      en: ["When do I get paid?", "When is commission earned?"]
    facts:
      - "Commission is earned when the customer's payment is verified in Grid Nova's bank account."
      - "Approved commission is paid monthly, by the 10th of the following month."
      - "The portal shows the commission rate that applies."
    do_not_say: ["commission percentages"]
