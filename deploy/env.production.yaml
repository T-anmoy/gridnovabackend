# Grid Nova backend — PRODUCTION non-secret environment (Cloud Run --env-vars-file).
# Prepared 26 Oct 2026 from deploy/env.template.yaml. No secrets here (they come from
# Secret Manager, RUNBOOK §5), so this file may be committed.
# Every value marked TODO must be replaced before the first deploy. The startup guard
# refuses empty or localhost values, but it does NOT recognise the TODO_ markers below:
# an unreplaced TODO boots and then fails at runtime (no uploads, no calendar).
# All values must be strings.

ENVIRONMENT: "production"

# The site answers on www (canonical) and the apex; both may send requests with Clerk tokens.
ALLOWED_ORIGINS: '["https://www.gridnova.in","https://gridnova.in"]'

# 2 = behind the global external HTTPS load balancer (RUNBOOK §10). Requires
# --ingress=internal-and-cloud-load-balancing on gridnova-api.
TRUSTED_PROXY_HOPS: "2"

FRONTEND_BASE_URL: "https://www.gridnova.in"
PUBLIC_API_BASE_URL: "https://api.gridnova.in"

# Clerk PRODUCTION instance on gridnova.in (Frontend API host shown in Clerk → Domains).
CLERK_JWT_ISSUER: "https://clerk.gridnova.in"

# Associate invitations (Phase 2 only — the portal stays closed at launch).
# FE-17 builds the /associates/sign-up page that completes the invitation.
ASSOCIATE_INVITE_REDIRECT_URL: "https://www.gridnova.in/associates/sign-up"

# Staff invitations (BE-17): where Clerk sends an invited staff member to finish sign-up.
# FE-17 builds this page.
STAFF_INVITE_REDIRECT_URL: "https://www.gridnova.in/dashboard/sign-up"

# Cloudflare R2 production bucket (private).
STORAGE_BUCKET: "gridnova-prod"
STORAGE_ENDPOINT_URL: "https://ed98840f4bf35d1f0069c9aaacc3af55.r2.cloudflarestorage.com"

# Sender must be on a domain verified in Resend (gridnova.in: SPF + DKIM).
NOTIFY_FROM_EMAIL: "Grid Nova <info@gridnova.in>"
# Staff alert recipients (shared mailboxes). After BE-17, staff holding the matching role also receive them.
STAFF_NOTIFY_EMAILS: "sales@gridnova.in,info@gridnova.in"
# Payment alerts (Accounts) and execution/service alerts (Operations).
ACCOUNTS_NOTIFY_EMAILS: "info@gridnova.in"
OPERATIONS_NOTIFY_EMAILS: "info@gridnova.in"

# Google Calendar (Book-a-Call slots). Client created in the gridnova-prod Google Cloud project.
GOOGLE_OAUTH_CLIENT_ID: "96474342653-vccm2lr6kn35h63ojundu9vsu0jrb4f5.apps.googleusercontent.com"
GOOGLE_OAUTH_REDIRECT_URI: "https://api.gridnova.in/api/v1/dashboard/employees/me/calendar/callback"

LLM_MODEL: "gpt-4o-mini"

# Proposal Studio (BE-18): the optional "fill from a message" assistant stays off at launch.
STUDIO_AI_FILL_ENABLED: "false"

# Connection budget (RUNBOOK §3): (10 + 5) × (4 api + 2 jobs) + 5 = 95 < Cloud SQL max_connections.
DB_POOL_SIZE: "10"
DB_MAX_OVERFLOW: "5"

# Business thresholds — current defaults, confirm with Grid Nova.
PROPOSAL_VALUE_MANAGER_APPROVAL_THRESHOLD: "500000"
CAPACITY_DIRECTOR_NOTIFY_THRESHOLD_MW: "1.0"
