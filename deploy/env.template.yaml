# Non-secret environment for one deployment (staging or production) — Cloud Run
# --env-vars-file. Copy to deploy/env.staging.yaml / deploy/env.production.yaml and replace
# every <…>. They hold no secrets, so they may be committed.
# Secrets are NOT here: they come from Secret Manager via --set-secrets (RUNBOOK §5).
# All values must be strings.
ENVIRONMENT: "<staging|production>"
# Exactly scheme://host, no trailing slash; both www and apex if both are used; on
# staging also the Vercel branch-alias URL the staging frontend is served from.
ALLOWED_ORIGINS: '["https://<FRONTEND_HOST>"]'
# 1 = clients reach Cloud Run directly (staging, *.run.app); 2 = through the external
# HTTPS load balancer (production custom domain). RUNBOOK §10.
TRUSTED_PROXY_HOPS: "<1|2>"
FRONTEND_BASE_URL: "https://<FRONTEND_HOST>"
PUBLIC_API_BASE_URL: "https://<API_HOST>"
CLERK_JWT_ISSUER: "https://<CLERK_FRONTEND_API_HOST>"
ASSOCIATE_INVITE_REDIRECT_URL: "https://<FRONTEND_HOST>/associates/sign-up"
STORAGE_BUCKET: "<R2_BUCKET>"
STORAGE_ENDPOINT_URL: "https://<R2_ACCOUNT_ID>.r2.cloudflarestorage.com"
NOTIFY_FROM_EMAIL: "Grid Nova <notifications@<VERIFIED_RESEND_DOMAIN>>"
STAFF_NOTIFY_EMAILS: "<comma-separated staff addresses>"
GOOGLE_OAUTH_CLIENT_ID: "<CLIENT_ID>.apps.googleusercontent.com"
GOOGLE_OAUTH_REDIRECT_URI: "https://<API_HOST>/api/v1/dashboard/employees/me/calendar/callback"
LLM_MODEL: "gpt-4o-mini"
# Connection budget (RUNBOOK §3): (DB_POOL_SIZE + DB_MAX_OVERFLOW) × total max instances.
DB_POOL_SIZE: "10"
DB_MAX_OVERFLOW: "5"
