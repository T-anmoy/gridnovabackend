# Grid Nova Energy — associate-led customer onboarding
#
# Read by app/onboarding/config.py and validated at startup (a malformed file stops
# the app from booting rather than failing mid-request). Grid Nova staff edit the
# wording and thresholds here without touching code. Anything marked [PLACEHOLDER]
# or [UNCONFIRMED] has not been supplied or confirmed by Grid Nova yet.

# The Customer Information Notice the associate reads out / shows to the customer and
# records as acknowledged on their behalf. Each onboarding stores the version and the
# time. New wording = a NEW version + point current_notice_version at it; never edit a
# version customers have already acknowledged.
current_notice_version: "placeholder-v0"
notice_versions:
  placeholder-v0:
    text: >-
      [PLACEHOLDER — the Customer Information Notice text is to be supplied by Grid Nova.]
  # Grid Nova's drafted notice (content/policies/GridNova_Policies_Draft_v1.md, document 7),
  # flattened for display with white-space: pre-line. Loaded, NOT current: point
  # current_notice_version at it once Grid Nova approves the text.
  draft-v1.1:
    text: |-
      Grid Nova Energy — how we use your information

      Grid Nova Energy will use the details, documents and photographs collected today to assess your site, prepare your proposal, install your solar system, and — if you choose — apply for government subsidy and grid connection through the national portal and your DISCOM.

      Your information is seen only by Grid Nova, the Associate helping you, and the government bodies involved in your application. We never sell it.

      Please pay only to Grid Nova's bank account, never in cash and never to any individual.

      You can ask Grid Nova to see, correct or delete your information at any time: info@gridnova.in · +91 98747 74440.

# The attribution lock has no time limit (Associate Terms A7, approved by Grid Nova on
# 21 Oct 2026: attribution stays with the first verified Associate "until the project is
# completed or closed"). It is derived in app/onboarding/service.py attribution().

# BE-10 referral links (/estimate?ref=GNA-…). A referral is information, not attribution:
# the referring Associate sees the enquiry in their portal, and the first complete,
# staff-verified onboarding still decides who the customer is attributed to (Associate
# Terms A7). `false` is the only value implemented; app/onboarding/config.py refuses
# anything else until Grid Nova decides otherwise and the rule is built.
referrals:
  # [UNCONFIRMED] engineering default (REF-1)
  auto_attribute: false

# Required documents. `required_when` is one of:
#   always                 — every onboarding
#   scheme_linked          — the site assessment is linked to a government scheme
#   not_in_customer_name   — the electricity connection or the property is not in the
#                            customer's own name
required_documents:
  - key: electricity_bill
    label: "Latest electricity bill"
    required_when: always
  - key: id_proof
    label: "Customer ID proof"
    required_when: always
  - key: ownership_proof
    label: "Property ownership proof"
    required_when: always
  - key: subsidy_bank_details
    label: "Bank details for subsidy credit"
    required_when: scheme_linked
  - key: photo
    label: "Customer / site photo"
    required_when: always
  - key: noc
    label: "No-objection certificate (connection or property not in the customer's name)"
    required_when: not_in_customer_name

# Sanity checks on what the associate entered. They produce WARNINGS only — never a
# rejection. [PLACEHOLDER] values are the code author's working assumptions for Grid
# Nova to confirm or replace.
sanity:
  # Warn when the requested capacity exceeds the DISCOM sanctioned load by this ratio.
  max_kw_to_sanctioned_load_ratio: 1.0          # [PLACEHOLDER]
  # Expected monthly generation per kW, used to compare capacity against consumption.
  kwh_per_kw_per_month: 120                     # [PLACEHOLDER]
  # Warn when expected generation exceeds monthly consumption by this ratio.
  max_generation_to_consumption_ratio: 1.5      # [PLACEHOLDER]
  # Tariff used to turn a monthly bill (INR) into units when no units were entered.
  # null = the bill-only comparison is skipped (no tariff has been confirmed).
  inr_per_kwh_for_bill_check: null              # [PLACEHOLDER]

# Customer-facing equipment package names → the stored equipment_tier value.
# Confirmed by Grid Nova's Pricing & Equipment Master Data (config/price_list.yaml):
# Nova Assured = standard, Nova Signature = premium.
equipment_packages:
  nova_assured:
    label: "Nova Assured"
    equipment_tier: standard
  nova_signature:
    label: "Nova Signature"
    equipment_tier: premium
  as_recommended:
    label: "As recommended by Grid Nova"
    equipment_tier: as_recommended

# Lead scoring v2 (app/onboarding/scoring.py) — associate-sourced customers only.
# score = Σ weight × fraction; weights must sum to 100. Every value here is the code
# author's working default for Grid Nova to tune — [PLACEHOLDER].
scoring:
  weights:
    verification_call: 20
    documents_complete: 15
    subsidy_eligibility: 20
    system_fit: 15
    customer_timeline: 10
    site_readiness: 5        # L5 — was 10; 5 moved to site_location
    site_location: 5         # L5 [PLACEHOLDER]
    associate_track_record: 10
  bands:
    hot_min: 70        # score ≥ 70 → Hot
    warm_min: 40       # score ≥ 40 → Warm, else Cold
  # Staff verification call due this long after the associate submits the customer.
  # Overdue customers escalate one step per further period: block-level Preferred,
  # then District Head, then State Head(s) of the site's territory, then Admin.
  response_hours:
    hot: 4
    warm: 24
    cold: 72
  timeline_fractions:
    within_1_month: 1.0
    within_3_months: 0.7
    within_6_months: 0.4
    later: 0.1
    unsure: 0.0
  system_fit_penalty: 0.5        # per capacity warning
  unknown_fraction: 0.5          # system fit when there is nothing to compare
  track_record_min_history: 3    # earlier submitted customers before track record counts
  new_associate_fraction: 0.5    # track record until then
  # L5 — the site_location factor: a confirmed location from a precise phone fix
  # (verified) earns 1.0, a confirmed but unverified one 0.5, an unconfirmed or missing
  # one 0.
  site_location_fractions:       # [PLACEHOLDER]
    confirmed_verified: 1.0
    confirmed_unverified: 0.5

# The customer's site location (app/onboarding/site_location.py, app/geo.py). Required
# and confirmed by the associate before a customer can be submitted. Every value here
# is a working default registered in config/placeholder_registry.yaml (L1–L7).
location:
  required_to_submit: true
  # L1 — accuracy (metres, as the phone reports it) of a GPS fix. At or under
  # accuracy_good_m a device/photo fix counts as verified; above accuracy_warn_m the
  # associate is warned to try again outdoors; above accuracy_reject_m it is refused.
  accuracy_good_m: 50            # [PLACEHOLDER]
  accuracy_warn_m: 150           # [PLACEHOLDER]
  accuracy_reject_m: 300         # [PLACEHOLDER]
  # L2 — flag the site pin when it is further than this from the median of the
  # in-app camera photos' GPS fixes.
  photo_mismatch_m: 200          # [PLACEHOLDER]
  # L3 — sanity box for "inside India" (it also covers parts of neighbouring countries).
  india_bbox:                    # [PLACEHOLDER]
    lat_min: 6.0
    lat_max: 37.5
    lon_min: 68.0
    lon_max: 97.5
  # L4 — the only hosts a pasted Google Maps link (and every redirect it follows) may
  # be on. Exact match; nothing else is ever requested.
  link_hosts_allowlist:          # [PLACEHOLDER]
    - maps.app.goo.gl
    - goo.gl
    - google.com
    - www.google.com
    - maps.google.com
    - google.co.in
    - www.google.co.in
  # L6 — short links expanded (outbound requests) per associate per hour.
  link_resolve_rate_limit: 20    # [PLACEHOLDER]
  # L7 — how long the app samples the phone's GPS for one fix (served via /options).
  sample_seconds: 10             # [PLACEHOLDER]

# The customer agreement, printed on ₹10 non-judicial stamp paper (app/onboarding/agreement.py).
# The generated PDF carries the parties and project details; the agreement's own
# wording is Grid Nova's to supply.
agreement:
  body: >-
    [PLACEHOLDER — the agreement text is to be supplied by Grid Nova.]
  # Blank space left at the top of page 1 for the stamp paper's own printed header.
  stamp_paper_top_margin_mm: 100   # [PLACEHOLDER] — confirm against the paper Grid Nova uses

# Whether a Preferred Associate viewing a customer in their territory (not one they
# onboarded) may open that customer's uploaded documents (ID proof, bills, photos), the
# agreement and the execution files. false = only the associate who onboarded the
# customer, and Grid Nova staff, can open them. Territory viewers never see exact
# coordinates or money either way.
territory_viewers_see_documents: false   # [UNCONFIRMED]
