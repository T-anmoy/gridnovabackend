exemptions:
  # Markers that are not dummy values — each still has to match a marker somewhere,
  # so a stale exemption fails the build too.
  - {file: app/associates/texts.py, anchor: PLACEHOLDER_MARKER, reason: detector constant — finds placeholder text}
  - {file: app/onboarding/config.py, anchor: PLACEHOLDER_MARKER, reason: detector constant — finds placeholder text}
  - {file: app/proposals/content_engine.py, anchor: PLACEHOLDER_MARKER, reason: detector constant used by the proposal send-guard}
  - {file: app/proposals/content_engine.py, anchor: compose_content, reason: "fallback text when a config key or the customer is missing: deliberately trips the send-guard"}
  - {file: app/proposals/content_engine.py, anchor: _format_pricing_body, reason: "fallback text when no price exists: deliberately trips the send-guard"}
  - {file: app/pdf/generator.py, anchor: _render_body_sections, reason: "fallback text when a field is missing: shows the gap instead of inventing content"}
  - {file: app/pdf/generator.py, anchor: _build_html, reason: "fallback text when a field is missing: shows the gap instead of inventing content"}
  - {file: app/memory/memory_manager.py, anchor: PLACEHOLDER_EMAIL_DOMAIN, reason: internal domain for customers with no email yet — a mechanism, not a dummy value}
  - {file: app/config.py, anchor: production_config_problems, reason: boot warnings that name the marker}
  - {file: app/payments/receipts.py, anchor: __doc__, reason: explains the receipt placeholder hold}
  - {file: app/payments/receipts.py, anchor: _content_has_dummy, reason: detector — holds a receipt that contains DUMMY text}
  - {file: app/placeholders/registry.py, anchor: MARKERS, reason: the registry's own marker patterns}
  - {file: app/placeholders/registry.py, anchor: DUMMY_TEXT_PREFIX, reason: the registry's own marker patterns}
  - {file: config/proposal_content.yaml, anchor: company, reason: file header explaining the marker convention}
  - {file: config/associate_documents.yaml, anchor: current_kyc_consent_version, reason: file header explaining the marker convention}
  - {file: config/associate_onboarding.yaml, anchor: current_notice_version, reason: file header explaining the marker convention}
  - {file: config/execution_payments.yaml, anchor: execution, reason: file header explaining the marker convention}
  - {file: config/handover_warranty.yaml, anchor: handover, reason: file header explaining the marker convention}
