# Grid Nova Energy — placeholder registry
#
# Every value in this codebase that Grid Nova has not supplied or confirmed yet, in one
# list. Read by app/placeholders/registry.py; served at GET /api/v1/dashboard/placeholders
# and printed by scripts/list_placeholders.py. This list is the client data request.
#
# Each entry:
#   id, area, location, description, dummy_value, needed_from_grid_nova, blocking, probe
#   area      proposals | pricing | onboarding | associates | execution | payments | company | policies
#   blocking  blocks_launch (customer-facing or legally required) | blocks_feature | tunable
#   probe     how the app tells whether the dummy is still in place:
#     yaml_contains_marker  the key's lines (its value, its comments) still carry a marker
#     yaml_equals           the key's value still equals dummy_value
#     constant_equals       a Python constant still equals its dummy_value
#     setting_equals        an environment setting still equals dummy_value
#     count_query           a named database check still finds dummy rows
#     manual                open until an admin marks it resolved (with a note)
#   location  YAML: {file, key} — `{other.key}` in a key is read from the same file.
#             Python: {file, symbols}. Settings: {env}.
#
# tests/test_placeholder_registry.py fails the build if any marker in app/, config/ or
# scripts/ — or any module-level PLACEHOLDER_* constant — is not claimed by an entry or
# listed under `exemptions` (with a reason). Resolving a dummy is an edit to the value
# where it lives, never to this file (except to record a new dummy).

