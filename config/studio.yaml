# Grid Nova Energy — Proposal Studio (BE-18).
#
# Read by app/studio/config.py and validated at startup (a malformed file stops the boot).
# The Studio renders through the BE-13 engine (app/proposals/document.py, document_render.py,
# config/proposal_document.yaml): header, footer, watermark, QR, letterhead, signatory,
# company paragraphs, quality policy, warranty rows and the GST rule live there and are never
# editable from the Studio. This file holds only what is Studio-specific.
#
# Numbers with decimals are quoted text (read as Decimal, never as a float).

schema_version: 1

# ── Project types ────────────────────────────────────────────────────────────────
# layout: compact_or_detailed (≤ layout_rule.compact_max_kwp → compact) | detailed | itemised
# segment / coverage: what the BE-13 engine reads (coverage = an uncovered segment whose scope
# text in config/proposal_content.yaml is still a registry placeholder: drafting and preview
# work, approval and issue answer 409 content_not_ready naming the registry ids).
# mount: rooftop | ground_mounted. housing_society: PM Surya Ghar GHS/RWA CFA (needs houses).
# category: the consumer category printed by default.
project_types:
  residential_rooftop:
    label: Residential rooftop
    layout: compact_or_detailed
    segment: residential
    coverage: null
    mount: rooftop
    category: Residential
  housing_society:
    label: Housing society / RWA
    layout: detailed
    segment: residential
    coverage: null
    mount: rooftop
    housing_society: true
    category: Residential
  commercial_rooftop:
    label: Commercial rooftop
    layout: compact_or_detailed
    segment: commercial
    coverage: null
    mount: rooftop
    category: Commercial
  industrial_rooftop:
    label: Industrial rooftop
    layout: compact_or_detailed
    segment: industrial
    coverage: null
    mount: rooftop
    category: Industrial
  ground_mounted:
    label: Ground-mounted
    layout: detailed
    segment: commercial
    coverage: utility
    mount: ground_mounted
    category: Commercial
  government_institutional:
    label: Government / institutional
    layout: detailed
    segment: government
    coverage: government
    mount: rooftop
    category: Government
  pm_kusum:
    label: PM-KUSUM (agricultural)
    layout: detailed
    segment: agricultural
    coverage: agricultural
    mount: ground_mounted
    category: Agricultural
  street_lighting:
    label: Street lighting and other itemised supply
    layout: itemised
    segment: null
    coverage: null
    mount: null
    category: null
  generic:
    label: Other solar project
    layout: detailed
    segment: null
    coverage: fallback
    mount: rooftop
    category: null

# ── Workflow ─────────────────────────────────────────────────────────────────────
workflow:
  # A version is issued without approval only when the proof-check has no errors, the price
  # is not below the price master and the total incl. GST is at most the PROPOSAL_VALUE_
  # MANAGER_APPROVAL_THRESHOLD setting (₹5,00,000 today). Otherwise a holder of studio.approve
  # who is not the preparer approves it.
  approval_when_below_price_master: true
  validity_days: 15                    # Grid Nova, 15 Oct 2026 (config/sales_policy.yaml)

# Payment terms a new document starts with (staff can change them). A plant up to 10 kW starts
# with the price list's 20 / 60 / 20 (config/price_list.yaml commercial_terms), above 10 kW with
# the 52 kWp sample's 25 / 60 / 15 (config/proposal_document.yaml detailed.payment_terms).
payment_terms:
  itemised:                            # [UNCONFIRMED] 25/60/15 as a plant above 10 kW (STU-9)
    - {percent: "25", label: Advance along with the order, short_label: advance with order}
    - {percent: "60", label: Against delivery of materials, short_label: against delivery of materials}
    - {percent: "15", label: On completion of installation, short_label: on completion}

# Messages staff send (never printed on the PDF). {name}, {reference}, {title}, {link}, {valid_until}.
messages:
  whatsapp: "Dear {name}, please find Grid Nova Energy's proposal {reference} ({title}) here: {link} — valid until {valid_until}."
  email_subject: "Your proposal from Grid Nova Energy — {reference}"
  email_lines:
    - "Dear {name},"
    - "Thank you for considering Grid Nova Energy. Please find our proposal {reference} ({title}) attached."
    - "You can also read it, download it and accept it online until {valid_until} using the link below."
  accepted_subject: "Proposal {reference} accepted — Grid Nova Energy"
  accepted_lines:
    - "Dear {name},"
    - "Thank you. We have recorded your acceptance of proposal {reference} ({title})."
    - "Our team will contact you about the next steps."
  expiry_subject: "Your proposal {reference} from Grid Nova Energy expires soon"
  expiry_lines:
    - "Dear {name},"
    - "Our proposal {reference} ({title}) is valid until {valid_until}."
    - "You can read it and accept it online using the link below."

# Wording printed where a proposal names how to pay (owner's decision 5).
payment_methods: "Payments by cheque, NEFT, RTGS or IMPS only."

# ── Reminders (daily job, POST /api/v1/dashboard/internal/check-studio-reminders) ────
reminders:
  not_viewed_after_days: 3
  expiring_within_days: 3
  customer_expiry_reminder: false      # true: also email the customer before expiry
  summary_expiring_within_days: 7

# ── Proof-check thresholds ─────────────────────────────────────────────────────────
warn_single_phase_above_kw: "7"
# Price per kWp (basic, ₹) outside this band raises a warning. null = no band supplied by Grid
# Nova, so no warning (STU-5). Per project type: {low: "…", high: "…"}.
price_per_kwp_band:                    # [UNCONFIRMED]
  residential_rooftop: null
  housing_society: null
  commercial_rooftop: null
  industrial_rooftop: null
  ground_mounted: null
  government_institutional: null
  pm_kusum: null
  generic: null
# States Grid Nova sells in today; any other state raises a warning.
service_states: [West Bengal, Bihar]
# Page count each layout must render to (a page count outside the range is an error).
page_ranges:
  compact: [3, 4]
  detailed: [8, 10]
  itemised: [2, 4]

