# ── Savings page (only from figures staff enter from the customer's own bill) ─────────
savings:
  # Generation basis: config/solar_estimate.yaml generation (units / kWp / month for the site's
  # state) — the same figure the proposal and the calculator print.
  # Module degradation by technology (mono_perc = Mono PERC, topcon = TOPCon). Researched assumptions (typical datasheet linear
  # warranty curves), not Grid Nova's panels' datasheets: STU-1 (Mono PERC), STU-2 (TOPCon).
  degradation:
    mono_perc: {first_year: "0.02", annual_after: "0.0055"}    # [UNCONFIRMED]
    topcon: {first_year: "0.01", annual_after: "0.004"}        # [UNCONFIRMED]
  # Tariff escalation a year: 0 (conservative; STU-3). Staff cannot raise it on a proposal.
  tariff_escalation: "0"               # [UNCONFIRMED]
  # Export credit ₹/unit: 0 — only self-consumed units are valued unless staff enter an export
  # rate on the proposal (STU-4).
  export_rate_default: "0"             # [UNCONFIRMED]
  years_shown: [1, 5, 10, 15, 20, 25]
  note: "Indicative estimate based on the tariff and consumption you shared; actual savings depend on generation, consumption pattern, tariff revisions and DISCOM settlement rules."
  # Optional line, off by default; never a tax claim.
  depreciation_line_enabled: false
  depreciation_line: "Businesses may be eligible for depreciation benefits — please consult your tax adviser."

# ── Itemised supply (street lighting and other line items) ────────────────────────
# GST per item category. A rate Grid Nova has not confirmed carries a registry id: drafting and
# preview use it, issuing a proposal with a line of that category is blocked (content_not_ready).
itemised:
  units: [Nos, Sets, Mtrs, Lot, Job]
  categories:
    solar_street_light:
      label: Solar street light
      # GST 2.0 (w.e.f. 22 Sep 2025): solar power based devices at 5 % (researched; STU-6).
      gst_rate: "0.05"                 # [UNCONFIRMED]
      registry: STU-6
      warranty_rows: null              # [PLACEHOLDER] not supplied by Grid Nova (STU-8)
      warranty_registry: STU-8
    installation_service:
      label: Installation and services
      # Works contract / installation services at 18 % (researched; STU-7).
      gst_rate: "0.18"                 # [UNCONFIRMED]
      registry: STU-7
      warranty_rows: []
      warranty_registry: null
  # Fixed text of the itemised layout (same frame as the plant proposals). The first letter
  # sentence is the samples'; the rest is drafted for this layout (STU-10).
  text:                                # [UNCONFIRMED]
    title: "PROPOSAL FOR SUPPLY & INSTALLATION"
    footer_title: "Supply & Installation Proposal"
    project_label: "SUPPLY & INSTALLATION"
    site_card_title: Project Site
    highlights: {items: LINE ITEMS, total: TOTAL INCL. GST, validity: OFFER VALIDITY}
    subtotal_line: Subtotal (before GST)
    scope_label: Customer Scope
    subject: "Proposal for Supply & Installation as per the Bill of Quantity below."
    letter:
      - "We take this opportunity to introduce Grid Nova Energy, a professionally managed solar energy company engaged in the design, engineering, procurement, installation and maintenance of solar power systems across India."
      - "Based on our discussions, we are pleased to submit our proposal for the supply and installation of the items listed in the Bill of Quantity with prices below."
    boq_title: BILL OF QUANTITY WITH PRICES
    boq_sub: Items, quantities, rates and GST as quoted.
    terms_title: PAYMENT TERMS, SCOPE & NOTES
    terms_sub: Payment schedule, customer scope and notes.

# ── Optional assistant (STUDIO_AI_FILL_ENABLED, off by default) ─────────────────────
# The only fields a suggestion may fill. Never price, BOQ, items, terms or any figure.
assistant_fields:
  addressee: [customer_type, title, name, attention, address_lines, mobile]
  site: [address_lines, town, state]
  connection: [discom, consumer_number, sub_division, sanctioned_load_kw, category, phase]

# ── Fixed wording the Studio adds to the BE-13 layouts (never editable from the Studio) ──
render:
  verify_url_base: https://www.gridnova.in/verify/p/
  # The customer's online proposal page: FRONTEND_BASE_URL + this path + the access token.
  public_page_path: /proposal/
  basic_before_discount_line: "Basic price"
  discount_line: "Less: Special discount"
  offered_line: "Offered basic price"
  special_notes_label: Special Notes
  payment_methods_label: "Mode of payment:"
  comparison_label: Package Comparison
  comparison_headers: [Package, Solar Panels (makes), Inverter (makes), Basic (Rs.), GST @ 8.9% (Rs.), Total (Rs.)]
  comparison_note: "Both packages are priced from Grid Nova's price list for the same capacity and phase. This proposal quotes the {package_name} package."
  savings_title: CUSTOMER SAVINGS ESTIMATE
  savings_sub: "Indicative, from the tariff and consumption you shared."
  savings_inputs_label: Basis
  savings_headers: [Year, Generation (units), Savings (Rs.), Cumulative Savings (Rs.)]
  savings_payback_label: "Simple payback on the effective cost"
  savings_basis_labels: {consumption: Average monthly consumption, tariff: Tariff (from your bill), generation: "Estimated generation, year 1", savings: "Estimated savings, year 1"}
  savings_assumptions: "Assumptions: module output 100 % in year 1, {first} % lower in year 2 and a further {annual} % lower each year after ({technology}); tariff escalation {escalation} % a year; exported units valued at Rs. {export} per unit."
  society_subsidy_label: "PM Surya Ghar CFA for Group Housing Society / RWA (Indicative)"
  society_total_line: Total project cost (incl. GST)
  society_subsidy_line: "Less: CFA on {kw} kW eligible capacity @ Rs. {rate} per kW"
  society_effective: EFFECTIVE COST AFTER CFA
  society_subsidy_note: "Central financial assistance under PM Surya Ghar: Muft Bijli Yojana for Group Housing Societies / Resident Welfare Associations is calculated on the eligible capacity (the lower of the installed capacity, {kw_per_house} kW per house for {houses} houses, and {max_kw} kW), as per scheme guidelines, subject to eligibility and availability."
