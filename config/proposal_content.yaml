base_sections:
  # Always included in every proposal, regardless of parameters.
  cover_letter_intro: |
    [PLACEHOLDER: Cover letter introduction — thank the customer, reference their
    enquiry, and set up the proposal that follows.]

  standard_terms: |
    Terms and conditions

    1. Price. Prices are in Indian rupees and include GST at the rates shown. If the GST rate or any statutory levy changes before invoicing, the rate notified by the Government applies.
    2. Validity. This offer is valid for the period stated in this proposal. After that, Grid Nova may revise it.
    3. Payment. Payment is accepted only by cheque, NEFT, RTGS or IMPS into Grid Nova Energy's current account printed in this proposal. Grid Nova never accepts cash, and no associate or employee may accept payment in their own name or account.
    4. Site. The customer provides safe access to the site; a shadow-free roof or land able to carry the system; space for the inverter and cable routes; and water and electricity during installation.
    5. Approvals and subsidy. Net metering, grid connection and any government subsidy are decided by the DISCOM and the government authorities. Grid Nova supports the applications but cannot guarantee their approval, amount or timing. A subsidy, where granted, is paid by the authority as the scheme provides.
    6. Timeline. Installation dates are fixed after the advance is received and the site is ready. Delays caused by approvals, site readiness, weather or events beyond Grid Nova's control extend the timeline.
    7. Warranty. Equipment carries its manufacturer's warranty. Grid Nova's system warranty is as stated in this proposal. Warranties do not cover misuse, changes made by others, natural calamity or theft.
    8. Ownership and risk. Ownership of the equipment passes to the customer on full payment; risk passes on delivery to the site.
    9. Cancellation. Cancellation after acceptance is governed by the agreement signed between the customer and Grid Nova.
    10. Jurisdiction. These terms are governed by the laws of India. Courts at Kolkata have jurisdiction.

  closing: |
    [PLACEHOLDER: Closing paragraph — validity period, next steps, and contact
    details for questions.]

sections_library:
  # Reusable content blocks, referenced by id from parameter_rules below.
  residential_rooftop_scope: |
    [PLACEHOLDER: Scope of work for a residential rooftop solar installation —
    site survey, structure, panels, inverter, net-metering, commissioning.]

  commercial_rooftop_scope: |
    [PLACEHOLDER: Scope of work for a commercial rooftop installation —
    structural assessment, higher-capacity system design, load analysis.]

  industrial_rooftop_scope: |
    [PLACEHOLDER: Scope of work for an industrial rooftop installation —
    large-scale engineering review, HT/LT integration, phased commissioning.]

  utility_scale_scope: |
    Scope of work — ground-mounted solar plant

    Grid Nova will deliver the plant on a turnkey basis, covering the items below as detailed in the bill of quantity of this proposal:
    • Site assessment: topographical survey, soil investigation and shadow analysis of the land provided by the customer.
    • Engineering: plant layout; design of the module mounting structures and foundations; DC and AC electrical design; earthing and lightning protection; single-line diagram.
    • Supply of solar modules, inverters, mounting structures, cables, combiner and distribution boxes, protection equipment, earthing and the monitoring system, of the makes stated in this proposal.
    • Civil and installation work: foundations, structure erection, module mounting, cable trenching and laying, inverter and switchgear installation.
    • Grid connection up to the agreed interconnection point, with support for the utility's approvals and inspections.
    • Testing and commissioning, with a commissioning report and as-built drawings.
    • Training of the customer's staff, and handover with operation and maintenance manuals.

    Not included unless this proposal states otherwise: land purchase or lease; land levelling beyond normal site preparation; boundary wall and approach road; the evacuation line beyond the interconnection point; fees and deposits payable to authorities; and approvals that must be obtained in the customer's own name.

  government_scope: |
    Scope of work — government and institutional projects

    Grid Nova will carry out the work in line with the tender or work order and the technical specification issued by the department or institution. Where this proposal and the tender documents differ, the tender documents prevail.
    • Site survey, and design, drawings and bill of quantity for the department's approval.
    • Supply of solar modules, inverters, mounting structures, cables, protection equipment and monitoring of the approved makes, with test certificates and warranty documents.
    • Installation, testing and commissioning, in the presence of the department's engineer where required.
    • Joint inspection, measurement and billing documents, and the completion certificate.
    • Liaison with the DISCOM for net metering or grid connection, where this is part of the work order.
    • Handover with as-built drawings, operation manuals and warranty cards, and training of the institution's nominated staff.

    Delivery milestones, payment terms, performance guarantees and the defect liability period are as stated in the tender or work order.

  pm_surya_ghar_subsidy_note: |
    [PLACEHOLDER: PM Surya Ghar subsidy note — eligibility and how it reduces the
    effective customer cost for residential rooftop systems.]

  pm_kusum_note: |
    About PM-KUSUM

    PM-KUSUM is the Government of India's scheme for solar pumps and solar power for farmers. Financial assistance under the scheme is decided by the Ministry of New and Renewable Energy and the state's implementing agency. It depends on the scheme component, the pump capacity, the applicant's eligibility and the funds available at the time.

    Grid Nova will help you apply, and will confirm with the implementing agency whether you are eligible and what assistance applies before you make any payment. Unless this proposal says otherwise, the price shown does not deduct any scheme assistance. Grid Nova cannot guarantee that an application will be approved, or how long approval will take.

  government_compliance_note: |
    Compliance

    • Grid Nova will submit the documents the tender asks for, such as registration, GST and PAN certificates, experience certificates and the required declarations.
    • Equipment will be of the makes and standards the tender specifies. Test certificates are supplied with the material, and domestic-content documents where the tender requires domestic-content equipment and this proposal states it.
    • Earnest money, security deposit and performance guarantee are furnished as the tender requires.
    • Work follows the applicable safety regulations and the requirements of the Central Electricity Authority, the state electricity regulator and the DISCOM.
    • Approvals that must be obtained in the department's own name remain the department's responsibility; Grid Nova will prepare the papers and support the application.

  fallback_generic_scope: |
    Scope of work

    Grid Nova will design, supply, install, test and commission the solar power system described in this proposal, including:
    • Site survey and system design.
    • Supply of the equipment listed in this proposal, of the stated makes.
    • Mounting structure, cabling, protection and earthing.
    • Installation, testing and commissioning.
    • Support with the DISCOM's net-metering or grid-connection process, where applicable.
    • Handover with warranty documents and a briefing on operating the system.

    Anything not listed here or in the bill of quantity is outside the scope of this proposal.

parameter_rules:
  # Each rule matches on lead parameters; ALL matching rules contribute their
  # sections — this is composable, not first-match-wins.
  - id: residential_rooftop
    match:
      project_type: rooftop
      segment: residential
    contributes: [residential_rooftop_scope, pm_surya_ghar_subsidy_note]
  - id: commercial_rooftop
    match:
      project_type: rooftop
      segment: commercial
    contributes: [commercial_rooftop_scope]
  - id: industrial_rooftop
    match:
      project_type: rooftop
      segment: industrial
    contributes: [industrial_rooftop_scope]
  - id: utility_scale
    match:
      project_type: ground_mounted
      capacity_kw_min: 500
    contributes: [utility_scale_scope]
  - id: agricultural_pump
    match:
      project_type: solar_pump
    contributes: [pm_kusum_note]
  - id: government_institutional
    match:
      segment: government
    contributes: [government_scope, government_compliance_note]

pricing:
  tiers:
    # Matched by project_type + capacity range; first matching tier wins.
    # Ranges must not overlap for the same project_type — validated at startup.
    # capacity_max_kw: null = no upper bound. rate_per_kw is INR/kW (> 0), or null.
    # rate_per_kw: null — Priced by staff: list-priced packages (West Bengal residential)
    # come from config/price_list.yaml; every other proposal is priced in Proposal Studio
    # or with adjust-pricing. A rate may be added later.
    - project_type: rooftop
      capacity_min_kw: 0
      capacity_max_kw: 10
      rate_per_kw: null
    - project_type: rooftop
      capacity_min_kw: 10
      capacity_max_kw: 100
      rate_per_kw: null
    - project_type: ground_mounted
      capacity_min_kw: 0
      capacity_max_kw: null   # null = no upper bound
      rate_per_kw: null
  segment_modifiers:
    # Multiplicative modifier applied after the base tier rate, if the lead's
    # segment matches — e.g. 0.95 = 5% reduction. 1.0 = no change.
    government: 1.0
