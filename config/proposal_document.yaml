  scope_sections:
    - label: Storage Area & Inverter Location
      text: The customer is required to provide safe storage space for the material on receipt at site. Inverters are generally IP65 rated and can be installed outdoors; the inverter location will be decided after detailed engineering and site study, preferably on the terrace with adequate space, access and ventilation.
    - label: Electrical Works
      text: Cabling between the solar panels, DCDB and inverters will be mostly outdoor and done using UV-resistant solar-grade cables. AC cabling from the inverter to the ACDB and the interconnection point will be done with suitable copper / aluminium cables, routed through existing cable trays or conduits or securely anchored to walls. The exact cable routing will be finalised during detailed engineering.
