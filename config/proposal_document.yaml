    - text: Provide suitable space for installation of the inverters and electrical panels.
    - text: Provide a safe and secure storage area for project materials on receipt at site. After delivery, the customer shall be responsible for the safety and security of the material until it is taken over by Grid Nova Energy’s team for installation.
    - text: Provide safe and permanent access to the roof for installation and future maintenance.
    - text: Provide a spare feeder / connection point in the existing LT panel or ACDB for interconnection of the solar system.
    - text: Provide internet connectivity to the inverter for remote monitoring of energy generation.
    - text: Provide power and water required during installation and commissioning.
    - text: Provide all applications and documents required for net metering and statutory approvals.
    - text: "Transformer or contracted-load enhancement, if required as per net-metering regulations, shall be at the customer’s cost."
